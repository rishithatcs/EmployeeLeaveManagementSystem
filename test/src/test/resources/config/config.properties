# =========================================================
# ELMS Test Automation – Environment Configuration
# =========================================================

# ------- Backend API Base URL -------
api.base.url=http://localhost:8080/api

# ------- Frontend Base URL (UI Tests) -------
ui.base.url=http://localhost:3000

# ------- Browser Configuration -------
# Options: chrome | firefox | edge
browser=chrome
headless=false
implicit.wait.seconds=10
explicit.wait.seconds=15
page.load.timeout.seconds=30

# ------- Seed Users (from data.sql) -------
employee.email=employee@test.com
employee.password=12345
manager.email=manager@test.com
manager.password=12345
admin.email=admin@test.com
admin.password=12345

# ------- Test Data -------
new.user.name=Test Automation User
new.user.email=autotest@elms.com
new.user.password=AutoTest@123
new.user.role=EMPLOYEE

# ------- Reports -------
report.output.dir=target/test-reports
report.name=ELMS Automation Report
